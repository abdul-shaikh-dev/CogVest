appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///add-holding?visualQaState=lookup&token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "add-holding-phase-asset"
    timeout: 30000
- tapOn:
    id: "asset-lookup-input"
- inputText: "hdfc"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "asset-lookup-result-visual-qa-lookup-hdfc"
    timeout: 5000
- tapOn:
    id: "asset-lookup-result-visual-qa-lookup-hdfc"
- assertVisible: "Live price autofilled from Visual QA seed."
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "2"
- tapOn:
    id: "average-cost-input"
- inputText: "1500"
- hideKeyboard
- tapOn:
    id: "review-holding-button"
- assertVisible:
    id: "review-quote-provenance"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "save-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holding-save-complete"
- openLink: "cogvest:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible: "Asset count: 1"
- assertVisible: "Opening position count: 1"
- assertVisible: "Duplicate identity count: 0"
- assertVisible: "Identity: HDFCBANK | HDFCBANK.NS"
- assertVisible: "Classification: stock | stock | other"
- assertVisible: "Market: INR | NSE | HDFCBANK.NS"
- assertVisible: "Quote: yahoo | ₹1,678.25"
- assertVisible: "Values: invested ₹3,000.00 | current ₹3,356.50 | quantity 2"

# Select the same provider candidate again. Persistence must reuse the asset.
- openLink: "cogvest:///add-holding?visualQaState=lookup&token=cogvest-local-visual-qa"
- tapOn:
    id: "asset-lookup-input"
- inputText: "hdfc"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "existing-asset-results"
    timeout: 5000
- tapOn: "Use HDFC Bank"
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "1"
- tapOn:
    id: "average-cost-input"
- inputText: "1600"
- hideKeyboard
- tapOn:
    id: "review-holding-button"
- scrollUntilVisible:
    element:
      text: "₹1,678.25"
    direction: DOWN
- assertVisible: "₹1,678.25"
- assertNotVisible: "Valuation pending"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "save-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holding-save-complete"
- openLink: "cogvest:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible: "Asset count: 1"
- assertVisible: "Opening position count: 2"
- assertVisible: "Duplicate identity count: 0"
- assertVisible: "Position count: 2"
- assertVisible: "Values: invested ₹4,600.00 | current ₹5,034.75 | quantity 3"
