appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
- openLink: "${SCHEME}:///settings"
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "privacy-details-toggle"
    direction: DOWN
- tapOn:
    id: "privacy-details-toggle"
# selector: the encryption disclosure is the copy under test
- scrollUntilVisible:
    element: ".*CogVest adds no encryption of its own.*"
    direction: DOWN
- assertVisible: ".*CogVest adds no encryption of its own.*"
- takeScreenshot: .expo/ux14-privacy
- scrollUntilVisible:
    element:
      id: "settings-android-backup"
    direction: DOWN
- assertVisible: "Android backup"
- assertVisible: "Excluded"
- assertVisible: "Cloud backup, device-to-device, and cross-platform transfer are disabled."
- takeScreenshot: .expo/ux14-backup
