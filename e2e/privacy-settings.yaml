appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///settings"
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "privacy-details-toggle"
    direction: DOWN
- tapOn:
    id: "privacy-details-toggle"
- scrollUntilVisible:
    element: ".*Separate app encryption is not included in V1.*"
    direction: DOWN
- assertVisible: ".*Separate app encryption is not included in V1.*"
- takeScreenshot: .expo/ux14-privacy
- scrollUntilVisible:
    element: "Android backup"
    direction: DOWN
- assertVisible: "Android backup"
- assertVisible: "Excluded"
- scrollUntilVisible:
    element: "Cloud backup, device-to-device, and cross-platform transfer are disabled."
    direction: DOWN
- assertVisible: "Cloud backup, device-to-device, and cross-platform transfer are disabled."
- takeScreenshot: .expo/ux14-backup
