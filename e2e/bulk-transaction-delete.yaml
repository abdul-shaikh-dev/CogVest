appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///accounting-qa?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: accounting-qa-screen
    timeout: 30000
- assertVisible: "Units 20; basis 1510; cash 0"
- tapOn:
    id: accounting-qa-toggle
- extendedWaitUntil:
    visible:
      id: trade-history-screen
    timeout: 10000
- tapOn:
    id: start-transaction-selection
- tapOn:
    id: review-trade-buy
- assertVisible: "1 selected"
- scrollUntilVisible:
    element:
      id: review-selected-transaction-deletion
    direction: DOWN
- tapOn:
    id: review-selected-transaction-deletion
- assertVisible:
    id: transaction-deletion-preview
- takeScreenshot: .expo/issue336-bulk-delete-preview
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: transaction-selection-count
    direction: UP
- assertVisible: "1 selected"
- scrollUntilVisible:
    element:
      id: cancel-transaction-selection
    direction: UP
- assertVisible: "Cancel selection"
- tapOn:
    id: cancel-transaction-selection
- assertVisible: ".*Accounting QA.*Purchase.*"
- tapOn:
    id: start-transaction-selection
- tapOn:
    id: select-all-transactions
- scrollUntilVisible:
    element:
      id: review-selected-transaction-deletion
    direction: DOWN
- tapOn:
    id: review-selected-transaction-deletion
- tapOn:
    id: confirm-delete-selected-transactions
- assertVisible: "1 transaction removed. Portfolio and automatic history updated."
- scrollUntilVisible:
    element:
      id: trade-history-back
    direction: UP
- tapOn:
    id: trade-history-back
- assertVisible: "Units 10; basis 500; cash 0"
- takeScreenshot: .expo/ux-enlarged/bulk-delete-result
