appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///add-holding?visualQaState=lookup&token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "add-holding-phase-asset"
    timeout: 30000
- tapOn:
    id: "asset-lookup-input"
- inputText: "hdfc"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "asset-lookup-result-visual-qa-lookup-hdfc"
    timeout: 5000
- tapOn:
    id: "asset-lookup-result-visual-qa-lookup-hdfc"
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "2"
- tapOn:
    id: "average-cost-input"
- inputText: "1500"
- tapOn:
    id: "conviction-4"
- scrollUntilVisible:
    element:
      id: "notes-input"
    direction: DOWN
- tapOn:
    id: "notes-input"
- inputText: "STALE HDFC NOTE"
- hideKeyboard
- tapOn:
    id: "back-button"
- tapOn:
    id: "back-button"
- tapOn:
    id: "selected-asset-change"
- tapOn:
    id: "asset-lookup-input"
- inputText: "nifty"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "asset-lookup-result-visual-qa-lookup-niftybees"
    timeout: 5000
- tapOn:
    id: "asset-lookup-result-visual-qa-lookup-niftybees"
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "review-holding-button"
- assertVisible: "Quantity must be greater than zero."
- assertVisible: "Average cost must be greater than zero."
- tapOn:
    id: "quantity-input"
- inputText: "3"
- tapOn:
    id: "average-cost-input"
- inputText: "250"
- hideKeyboard
- tapOn:
    id: "review-holding-button"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
- tapOn:
    id: "save-holding-button"
- assertVisible:
    id: "holding-save-complete"
- openLink: "cogvest:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible: "Asset count: 1"
- assertVisible: "Identity: NIFTYBEES | NIFTYBEES.NS"
- assertVisible: "Classification: etf | etf | diversified"
- assertVisible: "Quote: yahoo | ₹255.32"
- assertVisible: "Values: invested ₹750.00 | current ₹765.96 | quantity 3"
- assertVisible: "Position 1: quantity 3 | average ₹250.00 | note none | conviction none"
- assertNotVisible: "HDFC Bank"
- assertNotVisible: "STALE HDFC NOTE"
