appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- tapOn: "Replace with visual QA data"
- extendedWaitUntil:
    visible: "Visual QA portfolio seeded."
    timeout: 30000
- openLink: "${SCHEME}:///dashboard"
- tapOn:
    id: tab-settings
- assertVisible:
    id: value-mask-toggle
    checked: false
- assertVisible:
    id: display-mode-standard
    checked: true
- assertNotVisible: "Clear local data"
- assertNotVisible:
    id: settings-price-details
- waitForAnimationToEnd
- takeScreenshot: .expo/ux14-settings
- tapOn:
    id: value-mask-toggle
- assertVisible:
    id: value-mask-toggle
    checked: true
- tapOn:
    id: display-mode-minimal
- assertVisible:
    id: display-mode-minimal
    checked: true
- openLink: "${SCHEME}:///dashboard"
- assertNotVisible: "₹15.9L"
- assertVisible: "₹••••"
- assertNotVisible: "This Month"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: tab-settings
- assertVisible:
    id: value-mask-toggle
    checked: true
- assertVisible:
    id: display-mode-minimal
    checked: true
- tapOn:
    id: value-mask-toggle
- tapOn:
    id: display-mode-standard
- scrollUntilVisible:
    element:
      id: settings-price-details-toggle
    direction: DOWN
- tapOn:
    id: settings-price-details-toggle
- scrollUntilVisible:
    element:
      id: settings-newest-price-date
    direction: DOWN
- assertVisible: "Newest price update date"
- takeScreenshot: .expo/ux14-prices
- scrollUntilVisible:
    element:
      id: settings-manual-price-updates
    direction: DOWN
- assertVisible: "Manual price updates"
- assertNotVisible: "Live"
- scrollUntilVisible:
    element:
      id: settings-base-currency
    direction: DOWN
- assertVisible: "Base currency"
- assertVisible: "INR"
- assertNotVisible: "Clear local data"
- takeScreenshot: .expo/ux14-about
