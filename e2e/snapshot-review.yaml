appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-progress"
- assertVisible:
    id: "progress-screen"
# A fresh install has no history, so Progress shows its empty state and no
# status card; the month-end review screen is opened directly.
- assertVisible: "No portfolio history yet"
- openLink: "${SCHEME}:///review-snapshot"
- assertVisible:
    id: "review-snapshot-screen"
- scrollUntilVisible:
    element:
      id: "snapshot-month-input"
    direction: DOWN
- assertVisible:
    id: "snapshot-month-input"
- scrollUntilVisible:
    element:
      id: "cancel-snapshot-review-button"
    direction: DOWN
- tapOn:
    id: "cancel-snapshot-review-button"
- assertVisible:
    id: "progress-screen"
