appId: ${APP_ID}
---
# EPF surfaces across Light/Dark, Standard/Minimal and masking, rendered on an
# isolated synthetic database (EPF 142,567 with 50,000 moving), then cleared.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=cleanup"
- tapOn:
    id: epf-accounts-qa-cleanup
- assertVisible: "PASS: synthetic database cleared"
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=seed-matrix"
- tapOn:
    id: epf-accounts-qa-seed-matrix
- assertVisible: "PASS: seeded EPF 142567 with 50000 moving"

# dark · standard · values shown
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=detail&appearance=dark&mode=standard&masked=0"
- assertVisible:
    id: epf-account-total
- assertVisible: "₹92,567.00"
- takeScreenshot: .expo/epf-547/matrix/dark-standard-shown-detail
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=holdings&appearance=dark&mode=standard&masked=0"
- assertVisible:
    id: holdings-epf-section
- assertVisible: "₹1,42,567.00"
- takeScreenshot: .expo/epf-547/matrix/dark-standard-shown-holdings
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=dashboard&appearance=dark&mode=standard&masked=0"
- scrollUntilVisible:
    element:
      id: dashboard-epf-status
    direction: DOWN
- assertVisible: "EPF recorded balances"
- assertVisible: "Includes an EPF transfer in transit, counted once."
- takeScreenshot: .expo/epf-547/matrix/dark-standard-shown-dashboard
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=progress&appearance=dark&mode=standard&masked=0"
- assertVisible: "EPF is not in monthly history"
- takeScreenshot: .expo/epf-547/matrix/dark-standard-shown-progress

# light · standard · values shown
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=detail&appearance=light&mode=standard&masked=0"
- assertVisible:
    id: epf-account-total
- assertVisible: "₹92,567.00"
- takeScreenshot: .expo/epf-547/matrix/light-standard-shown-detail
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=holdings&appearance=light&mode=standard&masked=0"
- assertVisible:
    id: holdings-epf-section
- assertVisible: "₹1,42,567.00"
- takeScreenshot: .expo/epf-547/matrix/light-standard-shown-holdings
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=dashboard&appearance=light&mode=standard&masked=0"
- scrollUntilVisible:
    element:
      id: dashboard-epf-status
    direction: DOWN
- assertVisible: "EPF recorded balances"
- assertVisible: "Includes an EPF transfer in transit, counted once."
- takeScreenshot: .expo/epf-547/matrix/light-standard-shown-dashboard
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=progress&appearance=light&mode=standard&masked=0"
- assertVisible: "EPF is not in monthly history"
- takeScreenshot: .expo/epf-547/matrix/light-standard-shown-progress

# dark · minimal · masked
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=matrix&screen=detail&appearance=dark&mode=minimal&masked=1"
- assertVisible:
    id: epf-account-total
- assertVisible: "Amount hidden"
- assertNotVisible: "₹92,567.00"
