appId: ${APP_ID}
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///epf-reporting-qa?token=cogvest-local-visual-qa"
# Since #782 the Dashboard shows compact amounts; EPF capital is unknown, so invested is too.
- assertVisible:
    id: dashboard-invested-context
    text: ".*invested unknown.*"
- assertVisible: "EPF recorded balances"
- assertVisible:
    id: dashboard-epf-value
    text: "₹1.4L"
- assertVisible:
    id: dashboard-hero-value
    text: "₹2L"
- takeScreenshot: .expo/epf-545/standard
- scrollUntilVisible:
    element:
      id: dashboard-allocation-debt
    direction: DOWN
- assertVisible: "100.00%"
- takeScreenshot: .expo/epf-545/allocation
- openLink: "${SCHEME}:///epf-reporting-qa?token=cogvest-local-visual-qa&mode=minimal"
- tapOn:
    id: dashboard-performance-toggle
    retryTapIfNoChange: true
- assertVisible:
    id: dashboard-invested-context
    text: ".*invested unknown.*"
- tapOn:
    id: dashboard-mask-toggle
- assertNotVisible: "₹1.4L"
- assertVisible: "Amount hidden"
- takeScreenshot: .expo/epf-545/masked
- openLink: "${SCHEME}:///epf-reporting-qa?token=cogvest-local-visual-qa&mode=progress"
- assertVisible: "EPF is not in monthly history"
- scrollUntilVisible:
    element:
      id: progress-epf-month
    direction: DOWN
- assertVisible: "EPF at end of September 2026"
- assertVisible:
    id: progress-epf-month-value
    text: "₹1,40,000.00"
- assertVisible: "Last recorded balance; later activity is unconfirmed."
- takeScreenshot: .expo/epf-545/history-scope
