appId: ${APP_ID}
---
# Run after ppf-csv-import.yaml. Provision Download/CogVestPpfTemplate first.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "${SCHEME}:///holdings"
- tapOn: "CSV PPF"
- assertVisible: "₹14,350.00"
- scrollUntilVisible:
    element:
      id: ppf-import-csv
    direction: DOWN
- tapOn:
    id: ppf-import-csv
- tapOn:
    id: ppf-import-choose-csv
- back
- assertVisible:
    id: ppf-import-screen
- assertNotVisible: "Selected:.*"
- assertNotVisible:
    id: ppf-import-file-error
# The system picker remembers its last folder and view; start it fresh.
- clearState: com.google.android.documentsui
- tapOn:
    id: ppf-import-save-template
# A fresh folder picker opens at storage root, where saving is not allowed.
- extendedWaitUntil:
    visible: "Download"
    timeout: 10000
- tapOn:
    text: "Download"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "CogVestPpfTemplate"
    timeout: 10000
- tapOn: "CogVestPpfTemplate"
- tapOn: "Use this folder"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "cogvest-ppf-v1.csv saved.*"
    timeout: 10000
- takeScreenshot: .expo/ppf-csv-template-saved
- tapOn:
    id: ppf-import-back
- assertVisible: "₹14,350.00"
