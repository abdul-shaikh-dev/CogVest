appId: com.abdulshaikh.cogvest
---
# Disposable emulator only. Uses no private statement or password.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "cogvest:///import-transactions"
- tapOn:
    id: transaction-import-source-camsKfinCasPdfV1
- scrollUntilVisible:
    element:
      id: cas-statement-password
    direction: DOWN
- tapOn:
    id: cas-statement-password
- inputText: "synthetic-test-only"
- assertVisible: 'PDF password \(if required\)'
- assertVisible:
    id: cas-statement-password
- takeScreenshot: .expo/cas-password-keyboard
- hideKeyboard
- tapOn:
    id: cas-statement-password
- assertVisible: 'PDF password \(if required\)'
- assertVisible:
    id: cas-statement-password
- hideKeyboard
- assertVisible:
    id: select-cas-statement
- scrollUntilVisible:
    element:
      id: transaction-import-back
    direction: UP
- tapOn:
    id: transaction-import-back
- assertVisible:
    id: dashboard-screen
