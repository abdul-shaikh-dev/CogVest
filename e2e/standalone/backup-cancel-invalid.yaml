appId: com.abdulshaikh.cogvest
---
# Opt-in, synthetic visual-QA portfolio. Push the invalid fixture into the
# currently selected Documents/CogVest-QA folder before running this flow.
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 60000
- openLink: "cogvest:///backup?mode=export"
- tapOn:
    id: choose-backup-location
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: backup-screen
          commands:
            - back
- assertVisible:
    id: backup-export-warning
- assertNotVisible:
    id: backup-status
- openLink: "cogvest:///backup?mode=restore"
- tapOn:
    id: choose-backup-file
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: backup-screen
          commands:
            - back
- assertVisible:
    id: backup-restore-warning
- assertNotVisible:
    id: backup-status
- tapOn:
    id: choose-backup-file
- runFlow:
    when:
      visible:
        text: Documents
    commands:
      - tapOn:
          text: Documents
          index: 0
- runFlow:
    when:
      visible: CogVest-QA
    commands:
      - tapOn: CogVest-QA
- tapOn: invalid-portfolio-backup.json
- assertVisible: "This backup could not be read or validated. Choose an intact, supported CogVest backup. Your portfolio has not changed."
- assertNotVisible:
    id: backup-restore-preview
- takeScreenshot: .expo/backup-invalid
- tapOn:
    id: backup-back
- openLink: "cogvest:///holdings"
- tapOn:
    id: holdings-search-input
- inputText: HDFC
- hideKeyboard
- assertVisible: "Invested ₹36.25K"
