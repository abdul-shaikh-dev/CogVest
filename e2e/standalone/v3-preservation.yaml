appId: ${APP_ID}
---
# Existing standard synthetic portfolio only. No seed/reset or financial writes.
# Run before and after an in-place APK upgrade, with the same signing identity.
# Sampled UI smoke only: installation is external; this does not compare the
# complete persisted portfolio or prove that every record survived an upgrade.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "${SCHEME}:///holdings"
- tapOn:
    id: holdings-search-input
- inputText: "HDFC"
- hideKeyboard
- assertVisible:
    id: holding-invested-visual-qa-asset-hdfc
- tapOn:
    id: holding-row-visual-qa-asset-hdfc
- assertVisible: "25"
- assertVisible: "₹1,450.00"
- assertVisible: "15 Apr 2024"
- takeScreenshot: .expo/v3-retained-holding
- tapOn:
    id: holding-detail-back
- openLink: "${SCHEME}:///progress"
- assertVisible:
    id: progress-screen
- openLink: "${SCHEME}:///cash"
- assertVisible: "Deposit"
- assertVisible: "Withdraw"
- openLink: "${SCHEME}:///settings"
- assertVisible:
    id: settings-screen
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "${SCHEME}:///holdings"
- tapOn:
    id: holdings-search-input
- inputText: "HDFC"
- hideKeyboard
- assertVisible:
    id: holding-invested-visual-qa-asset-hdfc
