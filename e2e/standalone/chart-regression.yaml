# Opt-in only; supply LATEST_MONTH/PREVIOUS_MONTH from observed release state.
# Requires the 60-month QA dataset prepared in a development build,
# then retained by a same-key release upgrade. Never clear state or seed here.
appId: com.abdulshaikh.cogvest
---
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "cogvest:///visual-qa-seed?token=cogvest-local-visual-qa&history=long"
- assertVisible:
    id: visual-qa-seed-blocked
- openLink: "cogvest:///progress"
- assertVisible:
    id: progress-screen
- scrollUntilVisible:
    element:
      id: portfolio-monthly-chart-range-All
    direction: DOWN
- tapOn:
    id: portfolio-monthly-chart-range-All
- assertVisible:
    id: portfolio-trend-selected-panel
    text: "${LATEST_MONTH}.*% versus invested.*"
- tapOn:
    id: portfolio-trend-previous-month
- assertVisible:
    id: portfolio-trend-selected-panel
    text: "${PREVIOUS_MONTH}.*% versus invested.*"
- scrollUntilVisible:
    element:
      id: portfolio-trend-plot-region
    direction: DOWN
- swipe:
    from:
      id: portfolio-trend-plot-region
    direction: UP
- scrollUntilVisible:
    element:
      id: portfolio-trend-selected-panel
    direction: UP
- assertVisible:
    id: portfolio-trend-selected-panel
    text: "${PREVIOUS_MONTH}.*"
- takeScreenshot: .expo/standalone-portfolio-all
- scrollUntilVisible:
    element:
      id: portfolio-monthly-chart-range-3M
    direction: UP
- tapOn:
    id: portfolio-monthly-chart-range-3M
- tapOn:
    id: portfolio-monthly-chart-range-6M
- tapOn:
    id: portfolio-monthly-chart-range-1Y
- tapOn:
    id: portfolio-monthly-chart-range-All
- assertVisible:
    id: portfolio-trend-selected-panel
    text: "${LATEST_MONTH}.*"
- scrollUntilVisible:
    element:
      id: asset-monthly-chart-range-All
    direction: DOWN
- tapOn:
    id: asset-monthly-chart-range-All
- tapOn:
    id: asset-trend-previous-month
- assertVisible:
    id: asset-trend-selected-panel
    text: "${PREVIOUS_MONTH}.*% versus previous visible month.*"
- scrollUntilVisible:
    element:
      id: asset-trend-plot-region
    direction: DOWN
- swipe:
    from:
      id: asset-trend-plot-region
    direction: UP
- scrollUntilVisible:
    element:
      id: asset-trend-selected-panel
    direction: UP
- assertVisible:
    id: asset-trend-selected-panel
    text: "${PREVIOUS_MONTH}.*"
- takeScreenshot: .expo/standalone-assets-all
- scrollUntilVisible:
    element:
      id: open-monthly-history
    direction: DOWN
- tapOn:
    id: open-monthly-history
- scrollUntilVisible:
    element:
      id: snapshot-month-2026-05
    direction: DOWN
- assertVisible:
    id: snapshot-month-2026-05
- tapOn:
    id: snapshot-month-2026-05
- assertVisible: "₹19.87L"
- back
- scrollUntilVisible:
    element:
      id: history-year-2021
    direction: UP
- tapOn:
    id: history-year-2021
- scrollUntilVisible:
    element:
      id: snapshot-month-2021-06
    direction: DOWN
- tapOn:
    id: snapshot-month-2021-06
- assertVisible:
    id: selected-snapshot-summary
- assertVisible: "₹5.3L"
- takeScreenshot: .expo/standalone-oldest-month
- back
- assertVisible:
    id: snapshot-month-2021-06
- back
- assertVisible:
    id: progress-screen
- openLink: "cogvest:///holdings"
- assertVisible:
    id: holdings-screen
- openLink: "cogvest:///cash"
- assertVisible:
    id: cash-screen
- openLink: "cogvest:///settings"
- assertVisible:
    id: settings-screen
- stopApp
- launchApp
- assertVisible:
    id: dashboard-screen
