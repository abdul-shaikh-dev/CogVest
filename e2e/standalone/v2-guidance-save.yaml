appId: com.abdulshaikh.cogvest
---
# Opt-in standalone synthetic portfolio. Adds Guidance Holding (2 units, INR 200 invested).
# Does not reset data. Run once on the prepared V2 closeout portfolio.
- launchApp
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///add-holding"
- assertNotVisible:
    id: "nudge-metadata"
- tapOn:
    id: "toggle-manual-asset-entry"
- tapOn:
    id: "asset-input"
- inputText: "Guidance Holding"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "symbol-input"
    direction: DOWN
- tapOn:
    id: "symbol-input"
- inputText: "GUIDANCE"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "ticker-input"
    direction: DOWN
- tapOn:
    id: "ticker-input"
- inputText: "GUIDANCE"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "continue-class-button"
    direction: DOWN
- tapOn:
    id: "continue-class-button"
- scrollUntilVisible:
    element:
      id: "continue-position-button"
    direction: DOWN
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "2"
- tapOn:
    id: "average-cost-input"
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "price-input"
    direction: DOWN
- tapOn:
    id: "price-input"
- inputText: "125"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "toggle-position-options"
    direction: DOWN
- tapOn:
    id: "toggle-position-options"
- scrollUntilVisible:
    element:
      id: "dismiss-nudge-metadata"
    direction: DOWN
- assertVisible:
    id: "nudge-metadata"
- takeScreenshot: .expo/v2-release-guidance-metadata
- tapOn:
    id: "dismiss-nudge-metadata"
- scrollUntilVisible:
    element:
      id: "review-holding-button"
    direction: DOWN
- tapOn:
    id: "review-holding-button"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
- tapOn:
    id: "save-holding-button"
- assertVisible:
    id: "holding-save-complete"
- openLink: "cogvest:///holdings"
- tapOn:
    id: holdings-search-input
- inputText: "Guidance Holding"
- hideKeyboard
- assertVisible: "Invested ₹200"
- assertVisible: "₹250"
# Cold launch proves dismissal persistence, not just local component state.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///settings"
- assertNotVisible:
    id: "nudge-minimal"
- tapOn:
    id: "display-mode-minimal"
- takeScreenshot: .expo/v2-release-guidance-minimal
- openLink: "cogvest:///insight?kind=conviction"
- assertVisible: "Insights are paused"
- assertNotVisible:
    id: "nudge-insights"
- tapOn: "Done"
- openLink: "cogvest:///settings"
- tapOn:
    id: "display-mode-standard"
- openLink: "cogvest:///insight?kind=conviction"
- assertVisible: "Conviction pattern"
- assertNotVisible:
    id: "nudge-insights"
- tapOn:
    id: "insight-back"
- openLink: "cogvest:///holdings"
- tapOn:
    id: holdings-search-input
- inputText: "Guidance Holding"
- hideKeyboard
- assertVisible: "Invested ₹200"
- assertVisible: "₹250"
- takeScreenshot: .expo/v2-release-guidance-retained
