appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///visual-qa-seed?token=cogvest-local-visual-qa"
- assertVisible: "Replace local developer data?"
- tapOn: "Replace with visual QA data"
- extendedWaitUntil:
    visible: "Visual QA portfolio seeded."
    timeout: 30000
- openLink: "cogvest:///settings"
- tapOn:
    id: "display-mode-minimal"
- assertVisible:
    id: "display-mode-minimal"
- openLink: "cogvest:///dashboard"
- assertVisible: "Portfolio value"
- assertNotVisible: "Holdings P&L"
- tapOn:
    id: dashboard-performance-toggle
- assertVisible: "Holdings P&L"
- assertNotVisible: "This Month"
- assertNotVisible: "Investment patterns"
- openLink: "cogvest:///holdings"
- assertVisible:
    id: "holdings-search-input"
- assertNotVisible:
    id: "holdings-insights-button"
- assertNotVisible: "Invested"
- tapOn:
    id: holding-row-visual-qa-asset-bitcoin
- scrollUntilVisible:
    element: "Invested in remaining units"
    direction: DOWN
- assertVisible: "Invested in remaining units"
- back
- assertNotVisible: "Dominant position"
- assertNotVisible: "Best return"
- openLink: "cogvest:///cash"
- assertVisible: "Cash Ledger"
- assertVisible: "Deposit"
- assertVisible: "Withdraw"
- assertNotVisible: "This month"
- openLink: "cogvest:///progress"
- scrollUntilVisible:
    element: "Portfolio Growth"
    direction: DOWN
- assertVisible: "Portfolio Growth"
- scrollUntilVisible:
    element:
      id: progress-details-toggle
    direction: UP
- tapOn:
    id: progress-details-toggle
- scrollUntilVisible:
    element: "Value by asset class"
    direction: DOWN
- assertVisible: "Value by asset class"
- scrollUntilVisible:
    element:
      id: month-end-snapshot-status-card
    direction: UP
- assertVisible:
    id: "month-end-snapshot-status-card"
- assertNotVisible: "What changed this month?"
- openLink: "cogvest:///settings"
- tapOn:
    id: "display-mode-standard"
- openLink: "cogvest:///dashboard"
- scrollUntilVisible:
    element:
      id: dashboard-monthly-context
    direction: DOWN
- assertVisible:
    id: dashboard-monthly-context
- scrollUntilVisible:
    element:
      id: dashboard-insights
    direction: DOWN
- assertVisible:
    id: dashboard-insights
- openLink: "cogvest:///settings"
- tapOn:
    id: "display-mode-minimal"
- openLink: "cogvest:///add-holding?visualQaState=review&token=cogvest-local-visual-qa"
- scrollUntilVisible:
    element:
      text: "Review holding"
    direction: DOWN
- assertVisible: "Review holding"
- assertVisible:
    id: "save-holding-button"
