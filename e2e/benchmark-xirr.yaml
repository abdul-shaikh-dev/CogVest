appId: ${APP_ID}
---
# Benchmark return (#765): with the visual QA portfolio, the Dashboard's
# return breakdown points to Progress, where the Nifty 50 comparison loads
# with progress and draws the chart. Needs network: NAV history comes from
# AMFI. Back on the Dashboard, the breakdown shows the cached rate and gap,
# without the chart.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- tapOn: Replace with visual QA data
- extendedWaitUntil:
    visible: Visual QA portfolio seeded.
    timeout: 30000
- openLink: "${SCHEME}:///dashboard"
- extendedWaitUntil:
    visible:
      id: dashboard-xirr-toggle
    timeout: 15000
- tapOn:
    id: dashboard-xirr-toggle
- scrollUntilVisible:
    element:
      id: dashboard-benchmark-open-progress
    direction: DOWN
- assertNotVisible:
    id: dashboard-benchmark-rate
- tapOn:
    id: dashboard-benchmark-open-progress
- extendedWaitUntil:
    visible:
      id: progress-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: progress-benchmark-compare
    direction: DOWN
- tapOn:
    id: progress-benchmark-compare
- extendedWaitUntil:
    visible:
      id: progress-benchmark-rate
    timeout: 240000
- assertVisible:
    id: progress-benchmark-rate
    text: '[+-]?\d+\.\d\d% a year'
- assertVisible:
    id: progress-benchmark-gap
    text: 'Your portfolio: (\d+\.\d points (above|below) the index fund|Same as the index fund)'
# Visual QA data has month-end snapshots in the period, so the chart is drawn.
- scrollUntilVisible:
    element:
      id: progress-benchmark-note
    direction: DOWN
- assertVisible:
    id: progress-benchmark-chart
- assertVisible:
    id: progress-benchmark-readout-values
    text: 'Portfolio ₹[\d,.]+ · Fund ₹[\d,.]+'
- assertVisible:
    id: progress-benchmark-note
    text: 'Hypothetical\..*UTI Nifty 50 Index Fund.*Not advice\.'
- takeScreenshot: .expo/benchmark-xirr-chart

# The Dashboard reads the comparison from cached NAV: the rate and the gap,
# with a link to the chart, and no chart of its own.
- tapOn:
    id: tab-dashboard
- scrollUntilVisible:
    element:
      id: dashboard-benchmark-rate
    direction: DOWN
- assertVisible:
    id: dashboard-benchmark-rate
    text: '[+-]?\d+\.\d\d% a year'
- assertVisible:
    id: dashboard-benchmark-gap
    text: 'Your portfolio: (\d+\.\d points (above|below) the index fund|Same as the index fund)'
- assertNotVisible:
    id: progress-benchmark-chart
- takeScreenshot: .expo/benchmark-xirr-dashboard-summary
