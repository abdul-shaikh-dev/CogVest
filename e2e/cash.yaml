appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-cash"
    retryTapIfNoChange: true
- assertVisible:
    id: "cash-screen"
- tapOn:
    id: "cash-entry-deposit"
- scrollUntilVisible:
    element:
      id: "cash-amount-input"
    direction: DOWN
- tapOn:
    id: "cash-amount-input"
- inputText: "1000"
- hideKeyboard
- tapOn:
    id: "cash-label-input"
- inputText: "Broker cash"
- hideKeyboard
- tapOn:
    id: "cash-date-input"
- assertVisible: "OK"
- tapOn: "OK"
- scrollUntilVisible:
    element:
      id: "save-cash-entry-button"
    direction: DOWN
- doubleTapOn:
    id: "save-cash-entry-button"
- assertVisible: "Broker cash"
- assertVisible: "+₹1,000.00"
- assertNotVisible: "₹2,000.00"
- runScript:
    file: scripts/current-local-date.js
- assertVisible: "${output.currentLocalDate}"
# The Broker cash deposit is the only cash entry.
- scrollUntilVisible:
    element:
      id: "review-cash-entry-.*"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "review-cash-entry-.*"
    retryTapIfNoChange: true
- assertVisible:
    id: "review-cash-entry-screen"
- scrollUntilVisible:
    element:
      id: "delete-cash-entry-button"
    direction: DOWN
- tapOn:
    id: "delete-cash-entry-button"
- assertVisible: "Delete this cash entry?"
- scrollUntilVisible:
    element:
      id: "confirm-delete-cash-entry-button"
    direction: DOWN
- tapOn:
    id: "confirm-delete-cash-entry-button"
- assertVisible:
    id: "cash-screen"
- assertNotVisible: 'Review Broker cash\..*'
- assertVisible: "No cash movement yet"
