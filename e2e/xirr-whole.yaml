appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///xirr-qa?token=cogvest-local-visual-qa"
- tapOn:
    id: xirr-qa-reset-covered
- assertVisible:
    id: xirr-qa-status
    text: "Fixture ready"
- tapOn:
    id: xirr-qa-open-dashboard
- scrollUntilVisible:
    element:
      id: dashboard-xirr-rate
    direction: DOWN
# selector: the automatic-start rate and its assumption count are under test (#610)
- assertVisible:
    id: dashboard-xirr-rate
    text: "\\+10.00% a year"
- assertVisible:
    id: dashboard-xirr-assumptions
    text: "Estimate with 1 assumption. Open Breakdown to see it."
- takeScreenshot: .expo/xirr-whole-${SHOT}-rate
- tapOn:
    id: dashboard-xirr-toggle
- scrollUntilVisible:
    element:
      id: dashboard-xirr-set-basis
    direction: DOWN
# selector: the totals and the trade assumption are the values under test
- assertVisible:
    id: dashboard-xirr-paid-in
    text: "₹10,000.00"
- assertVisible:
    id: dashboard-xirr-current
    text: "₹11,000.00"
- assertVisible: "1 trade without a Cash record is counted as paid from outside CogVest."
- takeScreenshot: .expo/xirr-whole-${SHOT}-breakdown
- tapOn:
    id: dashboard-xirr-set-basis
- extendedWaitUntil:
    visible:
      id: measurement-basis-screen
    timeout: 15000
# selector: the automatic start shown to the user is under test
- assertVisible:
    id: measurement-basis-start
    text: "Automatic: from 31 Dec 2024 · ₹0.00"
- takeScreenshot: .expo/xirr-whole-${SHOT}-start
