appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible: "Replace local developer data?"
    timeout: 30000
- tapOn: "Replace with visual QA data"
- extendedWaitUntil:
    visible: "Visual QA portfolio seeded."
    timeout: 30000
- openLink: "${SCHEME}:///dashboard"
- scrollUntilVisible:
    element:
      id: "open-insight-conviction"
    direction: DOWN
- tapOn:
    id: "open-insight-conviction"
- assertVisible: "Conviction pattern"
- assertVisible: "Not enough data yet"
- scrollUntilVisible:
    element:
      id: "insight-show-records"
    direction: DOWN
- tapOn:
    id: "insight-show-records"
# selector: the recorded conviction shown in the insight is the value under test
- scrollUntilVisible:
    element:
      text: "Opening position.*conviction 4/5"
    direction: DOWN
- assertVisible: "HDFC Bank"
- scrollUntilVisible:
    element:
      id: "insight-mask-toggle"
    direction: UP
- tapOn:
    id: "insight-mask-toggle"
- assertNotVisible: "What contributed"
- assertNotVisible: "HDFC Bank"
- tapOn:
    id: "insight-mask-toggle"
- tapOn:
    id: "insight-back"
- assertVisible:
    id: "dashboard-screen"
- openLink: "${SCHEME}:///insight?kind=frequency"
- assertVisible: "Trading frequency"
- assertNotVisible: "Not enough data yet"
- openLink: "${SCHEME}:///insight?kind=patience"
- assertVisible: "Planned holding periods"
- assertVisible: "Not enough data yet"
- openLink: "${SCHEME}:///insight?kind=missing"
- assertVisible: "Insight unavailable"
- tapOn:
    id: "insight-unavailable-back"
- openLink: "${SCHEME}:///settings"
- tapOn:
    id: "display-mode-minimal"
- openLink: "${SCHEME}:///insight?kind=conviction"
- assertVisible: "Insights are paused"
- assertNotVisible: "What contributed"
- tapOn:
    id: "insight-paused-done"
- openLink: "${SCHEME}:///settings"
- tapOn:
    id: "display-mode-standard"
