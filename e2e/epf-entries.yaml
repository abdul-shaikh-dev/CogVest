appId: ${APP_ID}
---
# Records optional EPF entries through the real screens on an isolated synthetic
# database, re-reads the persisted ledger exactly, then clears that database.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=cleanup"
- tapOn:
    id: epf-accounts-qa-cleanup
- assertVisible: "PASS: synthetic database cleared"
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=seed-entries"
- tapOn:
    id: epf-accounts-qa-seed-entries
- assertVisible: "PASS: seeded Acme 140000 and Beta 0"
- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa"
- assertVisible:
    id: epf-account-total
    text: "₹1,40,000.00"

# Employee contribution 1,200 (voluntary PF).
- scrollUntilVisible:
    element:
      id: add-epf-entry
    direction: DOWN
- tapOn:
    id: add-epf-entry
- tapOn:
    id: epf-entry-amount-input
- inputText: "1200"
- hideKeyboard
- tapOn:
    id: epf-entry-voluntary
- scrollUntilVisible:
    element:
      id: review-epf-entry
    direction: DOWN
- tapOn:
    id: review-epf-entry
- assertVisible:
    id: epf-entry-effect-acme
    text: "₹1,40,000.00 → ₹1,41,200.00"
- takeScreenshot: .expo/epf-546-entries/contribution-review
- tapOn:
    id: save-epf-entry

# Employer contribution 367.
- scrollUntilVisible:
    element:
      id: add-epf-entry
    direction: DOWN
- tapOn:
    id: add-epf-entry
- tapOn:
    id: epf-entry-kind-picker
- tapOn:
    id: epf-entry-kind-employerContribution
- tapOn:
    id: epf-entry-amount-input
- inputText: "367"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: review-epf-entry
    direction: DOWN
- tapOn:
    id: review-epf-entry
- tapOn:
    id: save-epf-entry

# Official interest 1,000.
- scrollUntilVisible:
    element:
      id: add-epf-entry
    direction: DOWN
- tapOn:
    id: add-epf-entry
- tapOn:
    id: epf-entry-kind-picker
- tapOn:
    id: epf-entry-kind-interest
- tapOn:
    id: epf-entry-amount-input
- inputText: "1000"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: review-epf-entry
    direction: DOWN
- tapOn:
    id: review-epf-entry
- assertVisible:
    id: epf-entry-effect-total
    text: "₹1,41,567.00 → ₹1,42,567.00"
- assertVisible: "Counted as return earned, not as money put in."
- tapOn:
    id: save-epf-entry
- assertVisible:
    id: epf-account-total
    text: "₹1,42,567.00"

# Transfer 50,000 to Beta, still moving.
- scrollUntilVisible:
    element:
      id: add-epf-entry
    direction: DOWN
- tapOn:
    id: add-epf-entry
- tapOn:
    id: epf-entry-kind-picker
- tapOn:
    id: epf-entry-kind-transferOut
- tapOn:
    id: epf-entry-amount-input
- inputText: "50000"
- hideKeyboard
- tapOn:
    id: epf-entry-target-picker
- tapOn:
    id: epf-entry-target-beta
- tapOn:
    id: epf-entry-transfer-status-picker
- tapOn:
    id: epf-entry-transfer-status-inTransit
- scrollUntilVisible:
    element:
      id: review-epf-entry
    direction: DOWN
- tapOn:
    id: review-epf-entry
- assertVisible:
    id: epf-entry-effect-total
    text: "₹1,42,567.00 → ₹1,42,567.00"
- assertVisible: "Combined EPF is unchanged. ₹50,000.00 is counted once as moving until it arrives."
- takeScreenshot: .expo/epf-546-entries/transfer-review
- tapOn:
    id: save-epf-entry
- assertVisible:
    id: epf-account-total
    text: "₹92,567.00"
- scrollUntilVisible:
    element:
      id: epf-activity-toggle
    direction: DOWN
- tapOn:
    id: epf-activity-toggle
- takeScreenshot: .expo/epf-546-entries/activity

- openLink: "${SCHEME}:///epf-accounts-qa?token=cogvest-local-visual-qa&page=check-entries"
- tapOn:
    id: epf-accounts-qa-check-entries
- assertVisible: "PASS: EPF 142567; Acme 92567; Beta 0; 50000 moving; Cash unchanged"
- tapOn:
    id: epf-accounts-qa-cleanup
- assertVisible: "PASS: synthetic database cleared"
