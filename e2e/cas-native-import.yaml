appId: ${APP_ID}
---
# Fresh debug APK + Metro; push e2e/fixtures/cas-native-synthetic.pdf to Downloads.
# Uses only invented data. The QA seed route is development-only.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- tapOn: "Replace with visual QA data"
- extendedWaitUntil:
    visible: "Visual QA portfolio seeded."
    timeout: 30000
- openLink: "${SCHEME}:///import-transactions"
- tapOn:
    id: transaction-import-source-camsKfinCasPdfV1
- scrollUntilVisible:
    element:
      id: cas-statement-password
    direction: DOWN
- tapOn:
    id: cas-statement-password
- inputText: wrong-password
- hideKeyboard
- tapOn:
    id: select-cas-statement
- runFlow: standalone/helpers/open-downloads.yaml
- tapOn: cas-native-synthetic.pdf
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- scrollUntilVisible:
    element:
      id: transaction-import-screen-error
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: cas-statement-password
    direction: UP
- tapOn:
    id: cas-statement-password
- eraseText: 100
- inputText: synthetic-cas-test
- hideKeyboard
- tapOn:
    id: read-cas-statement
- extendedWaitUntil:
    visible:
      id: transaction-import-row-accounting
    timeout: 20000
# The review can land scrolled past the notices; start from the read action.
- scrollUntilVisible:
    element:
      id: read-cas-statement
    direction: UP
- scrollUntilVisible:
    element:
      id: cas-administrative-notices
    direction: DOWN
- scrollUntilVisible:
    element:
      id: cas-preserved-notices
    direction: DOWN
- assertVisible: "Cancellation notice retained in this review"
- scrollUntilVisible:
    element:
      id: transaction-import-show-balances
    direction: DOWN
- tapOn:
    id: transaction-import-show-balances
- scrollUntilVisible:
    element:
      id: transaction-import-holding-summary-.*
    direction: DOWN
- scrollUntilVisible:
    element:
      id: transaction-import-cost-.*
    direction: DOWN
- assertVisible: "2 transactions"
- assertVisible:
    id: transaction-import-units-.*
    text: "12"
- assertVisible:
    id: transaction-import-cost-.*
    text: "₹100.00"
- scrollUntilVisible:
    element:
      id: confirm-transaction-import
    direction: DOWN
- tapOn:
    id: confirm-transaction-import
- extendedWaitUntil:
    visible:
      id: holdings-screen
    timeout: 15000
- runFlow: helpers/cas-import-evidence.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- runFlow: helpers/cas-import-evidence.yaml
- openLink: "${SCHEME}:///import-transactions"
- tapOn:
    id: transaction-import-source-camsKfinCasPdfV1
- scrollUntilVisible:
    element:
      id: cas-statement-password
    direction: DOWN
- tapOn:
    id: cas-statement-password
- inputText: synthetic-cas-test
- hideKeyboard
- tapOn:
    id: select-cas-statement
- runFlow: standalone/helpers/open-downloads.yaml
- tapOn: cas-native-synthetic.pdf
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- scrollUntilVisible:
    element:
      id: transaction-import-row-accounting
    direction: DOWN
- assertVisible: ".*0 proposed additions.*2 duplicates.*"
- runFlow: helpers/cas-import-evidence.yaml
