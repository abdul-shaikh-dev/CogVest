appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-cash"
    retryTapIfNoChange: true
- assertVisible:
    id: "cash-screen"
- tapOn:
    id: "cash-entry-deposit"
- tapOn:
    id: "cash-amount-input"
- inputText: "1000"
- tapOn:
    id: "cash-label-input"
# Typed values avoid "rr": a debug build reloads on a double R keystroke that
# reaches the app instead of a focused field.
- inputText: "Asset fix cash"
# Label and date stay above the keyboard; hideKeyboard here can act as Back
# and leave the Cash tab.
- tapOn:
    id: "cash-date-input"
- tapOn: "OK"
- scrollUntilVisible:
    element:
      id: "save-cash-entry-button"
    direction: DOWN
- tapOn:
    id: "save-cash-entry-button"
# Manual holding plus a Cash-funded purchase, so deleting the asset must restore Cash.
- openLink: "cogvest:///add-holding"
- tapOn:
    id: "toggle-manual-asset-entry"
- tapOn:
    id: "asset-input"
- inputText: "Original Asset"
- hideKeyboard
- tapOn:
    id: "symbol-input"
- inputText: "ORIG"
- tapOn:
    id: "ticker-input"
- inputText: "ORIG.NS"
- hideKeyboard
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "1"
- tapOn:
    id: "average-cost-input"
- inputText: "50"
- tapOn:
    id: "price-input"
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "review-holding-button"
    direction: DOWN
- tapOn:
    id: "review-holding-button"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
- tapOn:
    id: "save-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holding-save-complete"
- openLink: "cogvest:///holdings"
- tapOn:
    id: holdings-add-button
- tapOn:
    id: record-purchase-option
- tapOn:
    id: "existing-asset-.*"
- tapOn:
    id: purchase-quantity
- inputText: "2"
- hideKeyboard
- tapOn:
    id: purchase-price
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: purchase-review-button
    direction: DOWN
- tapOn:
    id: purchase-review-button
- assertVisible:
    id: purchase-cash-debit
    text: "₹200.00"
- tapOn:
    id: purchase-confirm
- extendedWaitUntil:
    visible:
      id: holdings-screen
    timeout: 15000
- tapOn:
    id: "tab-holdings"
- tapOn:
    id: "holdings-more-button"
- tapOn:
    id: "holdings-manage-assets-button"
- assertVisible:
    id: "manage-assets-screen"
- tapOn:
    id: "manage-asset-.*"
- assertVisible:
    id: "review-asset-screen"
- tapOn:
    id: "asset-name-input"
- eraseText: 30
- inputText: "Renamed Asset"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "save-asset-correction-button"
    direction: DOWN
- doubleTapOn:
    id: "save-asset-correction-button"
# Editing from Manage Assets returns there, showing the corrected name.
- assertVisible:
    id: "manage-assets-screen"
- assertVisible: "Renamed Asset"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-holdings"
- tapOn:
    id: "holdings-more-button"
- tapOn:
    id: "holdings-manage-assets-button"
- assertVisible: "Renamed Asset"
- tapOn:
    id: "manage-asset-.*"
- scrollUntilVisible:
    element:
      id: "delete-asset-button"
    direction: DOWN
- tapOn:
    id: "delete-asset-button"
- assertVisible: "Delete Renamed Asset?"
- doubleTapOn:
    id: "confirm-delete-asset-button"
- assertVisible:
    id: "manage-assets-screen"
- assertNotVisible: "Renamed Asset"
- openLink: "cogvest:///holdings"
- assertVisible: "No holdings yet"
- tapOn:
    id: "tab-cash"
- assertVisible: "₹1,000.00"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-cash"
- assertVisible:
    id: "cash-screen"
- assertVisible: "₹1,000.00"
- tapOn:
    id: "tab-holdings"
- assertVisible: "No holdings yet"
