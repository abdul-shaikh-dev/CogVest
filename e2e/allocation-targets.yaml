appId: ${APP_ID}
---
# Target allocation (#764): set a target mix from Settings, check it is stored
# and compared on the Dashboard, then remove it.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- tapOn: Replace with visual QA data
- extendedWaitUntil:
    visible: Visual QA portfolio seeded.
    timeout: 30000
- openLink: "${SCHEME}:///settings"
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: open-allocation-targets
    direction: DOWN
- tapOn:
    id: open-allocation-targets
- extendedWaitUntil:
    visible:
      id: allocation-targets-screen
    timeout: 15000
- tapOn:
    id: allocation-target-equity
- inputText: "60"
- tapOn:
    id: allocation-target-debt
- inputText: "30"
- hideKeyboard
# An incomplete mix is not saved.
- tapOn:
    id: allocation-target-save
- assertVisible:
    id: allocation-target-error
- tapOn:
    id: allocation-target-cash
- inputText: "10"
- hideKeyboard
- tapOn:
    id: allocation-target-save
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- runFlow: helpers/open-e2e-evidence.yaml
- scrollUntilVisible:
    element:
      id: e2e-allocation-targets
    direction: DOWN
- assertVisible: "Allocation targets: equity 60 | debt 30 | crypto 0 | cash 10"

# The Dashboard compares the actual mix with the targets.
- openLink: "${SCHEME}:///"
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: dashboard-targets-new-money
    direction: DOWN
- assertVisible:
    id: dashboard-target-equity
- assertVisible:
    id: dashboard-target-cash

# Remove the targets.
- openLink: "${SCHEME}:///allocation-targets"
- extendedWaitUntil:
    visible:
      id: allocation-targets-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: allocation-target-clear
    direction: DOWN
- tapOn:
    id: allocation-target-clear
- runFlow: helpers/open-e2e-evidence.yaml
- scrollUntilVisible:
    element:
      id: e2e-allocation-targets
    direction: DOWN
- assertVisible: "Allocation targets: none"
