appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-cash"
    retryTapIfNoChange: true
- tapOn:
    id: "cash-entry-deposit"
- tapOn:
    id: "cash-amount-input"
- inputText: "1000"
- hideKeyboard
- tapOn:
    id: "cash-label-input"
- inputText: "Test contribution"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "save-cash-entry-button"
    direction: DOWN
- tapOn:
    id: "save-cash-entry-button"
- assertVisible: "₹1,000.00"
# Add Holding records an opening position (no Cash effect); Record a purchase
# is the Cash-funded buy, so only the 2 x 100 purchase reduces Cash.
- openLink: "cogvest:///add-holding"
- tapOn:
    id: "toggle-manual-asset-entry"
- tapOn:
    id: "asset-input"
- inputText: "Accounting Test Asset"
- hideKeyboard
- tapOn:
    id: "symbol-input"
- inputText: "ACCT"
- tapOn:
    id: "ticker-input"
- inputText: "ACCT.NS"
- hideKeyboard
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "1"
- tapOn:
    id: "average-cost-input"
- inputText: "50"
- tapOn:
    id: "price-input"
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "review-holding-button"
    direction: DOWN
- tapOn:
    id: "review-holding-button"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "save-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holding-save-complete"
- openLink: "cogvest:///cash"
- assertVisible: "₹1,000.00"
- openLink: "cogvest:///holdings"
- tapOn:
    id: holdings-add-button
- tapOn:
    id: record-purchase-option
- tapOn:
    id: "existing-asset-.*"
- tapOn:
    id: purchase-quantity
- inputText: "2"
- hideKeyboard
- tapOn:
    id: purchase-price
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: purchase-review-button
    direction: DOWN
- tapOn:
    id: purchase-review-button
- assertVisible:
    id: purchase-cash-debit
    text: "₹200.00"
- tapOn:
    id: purchase-confirm
- extendedWaitUntil:
    visible:
      id: holdings-screen
    timeout: 15000
- tapOn:
    id: "tab-cash"
- assertVisible: "₹800.00"
- tapOn:
    id: "tab-holdings"
- assertVisible: "Accounting Test Asset"
