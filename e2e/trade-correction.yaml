appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: "tab-cash"
    retryTapIfNoChange: true
- assertVisible:
    id: "cash-screen"
- tapOn:
    id: "cash-entry-deposit"
- tapOn:
    id: "cash-amount-input"
- inputText: "1000"
- tapOn:
    id: "cash-label-input"
# Typed values avoid "rr": a debug build reloads on a double R keystroke that
# reaches the app instead of a focused field.
- inputText: "Fix test cash"
# Label and date stay above the keyboard; hideKeyboard here can act as Back
# and leave the Cash tab.
- tapOn:
    id: "cash-date-input"
- tapOn: "OK"
- scrollUntilVisible:
    element:
      id: "save-cash-entry-button"
    direction: DOWN
- tapOn:
    id: "save-cash-entry-button"
# Manual holding first, then a Cash-funded purchase of 2 x 100 to correct.
- openLink: "${SCHEME}:///add-holding"
- tapOn:
    id: "toggle-manual-asset-entry"
- tapOn:
    id: "asset-input"
- inputText: "Fix Test Asset"
- hideKeyboard
- tapOn:
    id: "symbol-input"
- inputText: "FIXT"
- tapOn:
    id: "ticker-input"
- inputText: "FIXT.NS"
- hideKeyboard
- tapOn:
    id: "continue-class-button"
- tapOn:
    id: "continue-position-button"
- tapOn:
    id: "quantity-input"
- inputText: "1"
- tapOn:
    id: "average-cost-input"
- inputText: "50"
- tapOn:
    id: "price-input"
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "review-holding-button"
    direction: DOWN
- tapOn:
    id: "review-holding-button"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
- tapOn:
    id: "save-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holding-save-complete"
- openLink: "${SCHEME}:///holdings"
- tapOn:
    id: holdings-add-button
- tapOn:
    id: record-purchase-option
- tapOn:
    id: "existing-asset-.*"
- tapOn:
    id: purchase-quantity
- inputText: "2"
- hideKeyboard
- tapOn:
    id: purchase-price
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: purchase-review-button
    direction: DOWN
- tapOn:
    id: purchase-review-button
- assertVisible:
    id: purchase-cash-debit
    text: "₹200.00"
- tapOn:
    id: purchase-confirm
- extendedWaitUntil:
    visible:
      id: holdings-screen
    timeout: 15000
- tapOn:
    id: "tab-holdings"
- tapOn:
    id: "holding-row-.*"
- scrollUntilVisible:
    element:
      id: "holding-view-records"
    direction: DOWN
- tapOn:
    id: "holding-view-records"
- scrollUntilVisible:
    element:
      id: "review-transactions-.*"
    direction: DOWN
- tapOn:
    id: "review-transactions-.*"
- assertVisible:
    id: "trade-history-screen"
- tapOn:
    id: "review-trade-.*"
- assertVisible:
    id: "review-trade-screen"
- tapOn:
    id: "trade-correction-quantity-input"
- eraseText: 10
- inputText: "3"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: "save-trade-correction-button"
    direction: DOWN
- doubleTapOn:
    id: "save-trade-correction-button"
# Saving a correction returns to the open holding's details: 1 opening + 3 bought.
- assertVisible: "Transaction saved. Portfolio and cash records updated."
- assertVisible: "4"
- tapOn:
    id: "holding-detail-back"
- tapOn:
    id: "tab-cash"
- assertVisible: "₹700.00"
