appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///add-holding"
- tapOn:
    id: toggle-manual-asset-entry
- tapOn:
    id: asset-input
- inputText: "Sample ETF"
- hideKeyboard
- tapOn:
    id: symbol-input
- inputText: "SAMPLEETF"
- tapOn:
    id: ticker-input
- inputText: "SAMPLEETF.NS"
- hideKeyboard
- tapOn:
    id: continue-class-button
- assertVisible: "Stocks"
- assertVisible: "ETFs"
- assertVisible: "Debt"
- assertVisible: "Crypto"
- tapOn:
    id: "asset-class-etf"
- assertVisible: "ETF"
- assertVisible:
    id: sector-not-applicable
- tapOn:
    id: "asset-class-stock"
- assertVisible: "Stock"
- assertVisible:
    id: sector-type-picker
- tapOn:
    id: "asset-class-etf"
- assertVisible: "ETF"
- takeScreenshot: .expo/asset-class-280-etfs
- scrollUntilVisible:
    element:
      id: continue-position-button
    direction: DOWN
- tapOn:
    id: continue-position-button
- tapOn:
    id: quantity-input
- inputText: "2"
- tapOn:
    id: average-cost-input
- inputText: "90"
- tapOn:
    id: price-input
- inputText: "100"
- hideKeyboard
- tapOn:
    id: review-holding-button
- scrollUntilVisible:
    element:
      id: save-holding-button
    direction: DOWN
- tapOn:
    id: save-holding-button
- assertVisible:
    id: holding-save-complete
- scrollUntilVisible:
    element:
      id: view-holding-button
    direction: DOWN
- tapOn:
    id: view-holding-button
- assertVisible: "Sample ETF"
- assertVisible: "Invested"
- assertVisible: "₹180"
- assertVisible: "SAMPLEETF · ETF.*"
- tapOn:
    id: "holding-row-.*"
# selector: the saved classification is the value under test
- scrollUntilVisible:
    element:
      text: "Equity · ETF · Diversified"
    direction: DOWN
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    id: tab-holdings
- assertVisible: "Sample ETF"
- assertVisible: "Invested"
- assertVisible: "₹180"
- assertVisible: "SAMPLEETF · ETF.*"
- tapOn:
    id: "holding-row-.*"
# selector: the saved classification is the value under test
- scrollUntilVisible:
    element:
      text: "Equity · ETF · Diversified"
    direction: DOWN
- takeScreenshot: .expo/asset-class-280-saved-etf
