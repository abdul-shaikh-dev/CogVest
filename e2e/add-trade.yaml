appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- assertVisible:
    id: "dashboard-screen"
- openLink: "cogvest:///add-holding"
- assertVisible:
    id: "add-holding-screen"
- assertVisible:
    id: "add-holding-phase-asset"
- tapOn:
    id: "toggle-manual-asset-entry"
- tapOn:
    id: "asset-input"
- inputText: "Reliance Industries"
- hideKeyboard
- tapOn:
    id: "symbol-input"
- inputText: "RELIANCE"
- tapOn:
    id: "ticker-input"
- inputText: "RELIANCE.NS"
- hideKeyboard
- tapOn:
    id: "continue-class-button"
- assertVisible:
    id: "add-holding-phase-class"
- assertVisible:
    id: "sector-type-picker"
- tapOn:
    id: "sector-type-picker"
- assertVisible: "Unknown"
- tapOn:
    id: "sector-type-technology"
- tapOn:
    id: "continue-position-button"
- assertVisible:
    id: "add-holding-phase-position"
- tapOn:
    id: "quantity-input"
- inputText: "2"
- tapOn:
    id: "average-cost-input"
- inputText: "90"
- tapOn:
    id: "price-input"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "conviction-4"
- tapOn:
    id: "review-holding-button"
- assertVisible:
    id: "add-holding-phase-review"
- scrollUntilVisible:
    element:
      id: "derived-preview"
    direction: DOWN
- assertVisible:
    id: "derived-preview"
- scrollUntilVisible:
    element:
      id: "save-holding-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "save-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holding-save-complete"
- scrollUntilVisible:
    element:
      id: "view-holding-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "view-holding-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "holdings-screen"
- assertVisible: "Reliance Industries"
