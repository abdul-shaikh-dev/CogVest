appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
- openLink: "cogvest:///futures"
- assertVisible:
    id: "futures-screen"
- tapOn:
    id: "futures-opening-wallet"
- eraseText: 50
- inputText: "1000"
- hideKeyboard
- tapOn:
    id: "futures-save-account"
- assertVisible: "1000 USDT"
- scrollUntilVisible:
    element:
      id: "futures-add-event"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-add-event"
- scrollUntilVisible:
    element:
      id: "futures-quantity"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-quantity"
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "futures-price"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-price"
- inputText: "100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "futures-fee"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-fee"
- eraseText: 10
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "futures-leverage"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-leverage"
- inputText: "10"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "futures-save-event"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-save-event"
# selector: the wallet balance is the value under test
- scrollUntilVisible:
    element:
      text: "999 USDT"
    direction: UP
    timeout: 60000
- assertVisible: "999 USDT"
# The opening execution is the only activity, so it has the only Edit button.
- scrollUntilVisible:
    element:
      id: "edit-futures-.*"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "edit-futures-.*"
- scrollUntilVisible:
    element:
      id: "futures-price"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-price"
- eraseText: 20
- inputText: "120"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "futures-save-event"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "futures-save-event"
# selector: the restored position line is the value under test
- scrollUntilVisible:
    element:
      text: "Qty 1.*Entry 120 USDT.*"
    direction: UP
    timeout: 60000
- assertVisible: "Qty 1.*Entry 120 USDT.*"
- openLink: "cogvest:///backup?mode=export"
- assertVisible: "This backup contains sensitive financial information and is not encrypted."
- tapOn:
    id: choose-backup-location
- runFlow:
    when:
      visible: "Can.t use this folder"
    commands:
      - tapOn: "Documents"
- tapOn: USE THIS FOLDER
- tapOn: ALLOW
- extendedWaitUntil:
    visible: ".*saved. Keep this unencrypted file somewhere you trust."
    timeout: 15000
- copyTextFrom: ".*saved. Keep this unencrypted file somewhere you trust."
- evalScript: ${output.backupName = maestro.copiedText.split(' saved.')[0]}
- openLink: "cogvest:///futures"
- scrollUntilVisible:
    element:
      id: futures-delete-account
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
# A disconnected Metro warning can intercept this bottom-of-screen action.
# Use a standalone APK for the release gate; never dismiss warnings to pass it.
- assertNotVisible: ".*Open debugger to view warnings.*"
- tapOn:
    id: futures-delete-account
- assertVisible: "Delete Futures wallet?"
- takeScreenshot: .expo/futures-post-export-confirmation
- tapOn:
    id: futures-cancel-delete
# selector: the wallet balance is the value under test
- scrollUntilVisible:
    element: "999 USDT"
    direction: UP
    timeout: 60000
- assertVisible: "999 USDT"
- scrollUntilVisible:
    element:
      id: futures-delete-account
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: ".*Open debugger to view warnings.*"
- tapOn:
    id: futures-delete-account
- assertVisible: "Delete Futures wallet?"
- tapOn:
    id: futures-confirm-delete
- openLink: "cogvest:///futures"
- assertVisible:
    id: futures-save-account
- openLink: "cogvest:///backup?mode=restore"
- tapOn:
    id: choose-backup-file
# selector: the exported file's name in the Android document picker
- scrollUntilVisible:
    element: ${output.backupName}
    direction: DOWN
    timeout: 60000
# selector: the exported file's name in the Android document picker
- tapOn: ${output.backupName}
- extendedWaitUntil:
    visible:
      id: backup-restore-preview
    timeout: 15000
- assertVisible: "Futures accounts"
- scrollUntilVisible:
    element:
      id: continue-restore-confirmation
    direction: DOWN
    timeout: 60000
- tapOn:
    id: continue-restore-confirmation
- tapOn:
    id: confirm-restore-replacement
- extendedWaitUntil:
    visible:
      id: backup-restore-done
    timeout: 30000
- tapOn:
    id: backup-restore-done
- openLink: "cogvest:///futures"
- assertVisible:
    id: futures-screen
# selector: the wallet balance is the value under test
- scrollUntilVisible:
    element:
      text: "999 USDT"
    direction: UP
    timeout: 60000
- assertVisible: "999 USDT"
# selector: the restored position line is the value under test
- scrollUntilVisible:
    element:
      text: "Qty 1.*Entry 120 USDT.*"
    direction: DOWN
    timeout: 60000
- assertVisible: "Qty 1.*Entry 120 USDT.*"
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-review-futures
    timeout: 30000
- tapOn:
    id: dashboard-review-futures
- assertVisible:
    id: "futures-screen"
# selector: the wallet balance is the value under test
- scrollUntilVisible:
    element:
      text: "999 USDT"
    direction: UP
    timeout: 60000
- assertVisible: "999 USDT"
# selector: the restored position line is the value under test
- scrollUntilVisible:
    element:
      text: "Qty 1.*Entry 120 USDT.*"
    direction: DOWN
    timeout: 60000
- assertVisible: "Qty 1.*Entry 120 USDT.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .expo/futures-roundtrip-restored
