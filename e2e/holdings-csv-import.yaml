appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
# The system picker remembers its last folder and view; start it fresh.
- clearState: com.google.android.documentsui
- openLink: "${SCHEME}:///import-holdings?visualQaState=lookup&token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "holding-import-screen"
    timeout: 30000
- tapOn:
    id: "save-holdings-csv-template"
# A fresh folder picker opens at storage root, where saving is not allowed.
- extendedWaitUntil:
    visible: "Documents"
    timeout: 10000
- tapOn:
    text: "Documents"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Files in Documents"
    timeout: 10000
- tapOn: "Use this folder"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    # Repeat runs in the same folder get a numbered copy, e.g. "(1)".
    visible: 'cogvest-holdings-v1.*\.csv saved\. Replace the example rows, then choose the completed CSV\.'
    timeout: 10000
- tapOn:
    id: "select-holdings-csv"
- runFlow: standalone/helpers/open-downloads.yaml
- extendedWaitUntil:
    visible: "holdings-import-v1.csv"
    timeout: 10000
- tapOn: "holdings-import-v1.csv"
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- extendedWaitUntil:
    visible:
      id: "holding-import-row-3-candidate-visual-qa-lookup-tcs"
    timeout: 10000
- assertVisible: "HDFC Bank • HDFCBANK.NS • Equity • INR"
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "93%,92%"
- tapOn:
    id: "holding-import-row-3-candidate-visual-qa-lookup-tcs"
- scrollUntilVisible:
    element:
      id: "holding-import-summary"
    direction: DOWN
    timeout: 20000
- assertVisible: "Row 3 • 1 unit"
- assertVisible: "₹6,000.00"
- assertVisible: "₹6,506.75"
# The import button sits directly below the summary's last row.
- scrollUntilVisible:
    element:
      id: "confirm-holdings-import"
    direction: DOWN
    timeout: 10000
- assertVisible: "Skipped"
- takeScreenshot:
    path: holdings-csv-import-preview
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "93%,92%"
- scrollUntilVisible:
    element:
      id: "confirm-holdings-import"
    direction: DOWN
- tapOn:
    id: "confirm-holdings-import"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "quick-setup-review-screen"
    timeout: 10000
- assertVisible: "2 holdings saved"
- tapOn:
    id: "quick-setup-complete"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
- assertVisible: "Portfolio value"
- assertVisible: "₹6.51K"
- assertVisible: "Invested"
- assertVisible: "₹6K"
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible: "Asset count: 2"
- assertVisible: "Opening position count: 2"
- assertVisible: "Duplicate identity count: 0"
- assertVisible: "Total invested: ₹6,000.00"
- assertVisible: "Total current: ₹6,506.75"
- assertVisible: "Valuation: complete | pending 0"
