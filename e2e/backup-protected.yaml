appId: ${APP_ID}
---
# Passphrase-protected backup and restore (#760). Synthetic visual-QA data only.
# The runner empties Documents/CogVest-QA before this flow. It saves the seeded
# portfolio with a passphrase, clears the app, rejects a wrong passphrase, then
# unlocks and restores the file and checks the stored records through
# e2e-evidence.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- tapOn: Replace with visual QA data
- extendedWaitUntil:
    visible: Visual QA portfolio seeded.
    timeout: 30000

# Export with a passphrase into Documents/CogVest-QA.
- openLink: "${SCHEME}:///backup?mode=export"
- tapOn:
    id: backup-protect
- tapOn:
    id: backup-passphrase
- inputText: "synthetic qa passphrase"
- tapOn:
    id: backup-passphrase-confirm
- inputText: "synthetic qa passphrase"
- hideKeyboard
- takeScreenshot: .expo/backup-protected-export
- tapOn:
    id: choose-backup-location
- runFlow:
    when:
      notVisible: Files in CogVest-QA
    commands:
      - scrollUntilVisible:
          element: Documents
          direction: DOWN
      - tapOn: Documents
      # selector: the QA folder's name in the Android folder picker
      - tapOn: CogVest-QA
- tapOn: USE THIS FOLDER
- tapOn: ALLOW
# selector: the saved message names the protected file, which is under test
- extendedWaitUntil:
    visible: ".*-protected.json saved. It opens only with its passphrase.*"
    timeout: 60000
- copyTextFrom: ".*-protected.json saved. It opens only with its passphrase.*"
- evalScript: ${output.backupName = maestro.copiedText.split(' saved.')[0]}

# Start again from an empty app; the backup file stays in shared storage.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible: "Asset count: 0"

# Restore. The picker reopens in the folder used for the export.
- openLink: "${SCHEME}:///backup?mode=restore"
- tapOn:
    id: choose-backup-file
# selector: the exported file's name in the Android document picker
- scrollUntilVisible:
    element: ${output.backupName}
    direction: DOWN
# selector: the exported file's name in the Android document picker
- tapOn: ${output.backupName}
- extendedWaitUntil:
    visible:
      id: backup-restore-unlock
    timeout: 15000

# A wrong passphrase is refused and the file stays selected.
- tapOn:
    id: backup-unlock-passphrase
- inputText: "wrong qa passphrase"
- hideKeyboard
- tapOn:
    id: backup-unlock
# selector: the refusal message is under test
- extendedWaitUntil:
    visible: "The passphrase is wrong, or the file has been changed.*"
    timeout: 60000
- assertVisible:
    id: backup-restore-unlock
- takeScreenshot: .expo/backup-protected-wrong

# The right passphrase opens the same review as an ordinary backup.
- tapOn:
    id: backup-unlock-passphrase
- eraseText: 40
- inputText: "synthetic qa passphrase"
- hideKeyboard
- tapOn:
    id: backup-unlock
- extendedWaitUntil:
    visible:
      id: backup-restore-preview
    timeout: 60000
- assertVisible:
    id: backup-count-file-Assets
    text: "5"
- assertVisible:
    id: backup-count-file-Cash entries
    text: "4"
- scrollUntilVisible:
    element:
      id: continue-restore-confirmation
    direction: DOWN
- tapOn:
    id: continue-restore-confirmation
- tapOn:
    id: confirm-restore-replacement
- extendedWaitUntil:
    visible:
      id: backup-restore-done
    timeout: 30000
- tapOn:
    id: backup-restore-done
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000

# The restored records and values match the seeded portfolio.
- runFlow:
    file: helpers/backup-restored-evidence.yaml
