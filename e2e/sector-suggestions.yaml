appId: ${APP_ID}
---
# #823: an exchange ETF saved as a company share gets an ETF and sector
# suggestion from its name; a bank's share is never touched by it. The
# breakdown shows INR amounts, and the bank, left Unknown, gets its sector set
# by hand from the shortcut. The stored records are asserted, not only the
# confirmations.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
- runFlow:
    file: helpers/add-manual-listed-holding.yaml
    env:
      NAME: "Nippon India ETF Nifty IT"
      SYMBOL: "ITBEES"
      TICKER: "ITBEES.NS"
      QUANTITY: "10"
      COST: "40"
      PRICE: "60"
- runFlow:
    file: helpers/add-manual-listed-holding.yaml
    env:
      NAME: "Bank of Baroda"
      SYMBOL: "BANKBARODA"
      TICKER: "BANKBARODA.NS"
      QUANTITY: "2"
      COST: "200"
      PRICE: "200"
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible:
    id: "e2e-asset-itbees-ns-classification"
# selector: stored e2e-evidence values are under test
- assertVisible: "Classification: stock \\| stock \\| other"
- openLink: "${SCHEME}:///holdings"
- scrollUntilVisible:
    element:
      id: "holdings-insights-button"
    direction: DOWN
- tapOn:
    id: "holdings-insights-button"
- scrollUntilVisible:
    element:
      id: "holdings-sector-review"
    direction: DOWN
- assertVisible:
    id: "holdings-sector-other"
- assertNotVisible:
    id: "holdings-sector-technology"
- tapOn:
    id: "holdings-sector-review"
- extendedWaitUntil:
    visible:
      id: "sector-suggestions-screen"
    timeout: 10000
# selector: the suggestion text is under test
- assertVisible: "Nippon India ETF Nifty IT"
- assertVisible: "Sector: Unknown → Technology · Type: Stock → ETF"
# The bank gets no suggestion: one change to apply, and it is listed under
# No suggestion instead.
- assertVisible:
    id: "sector-suggestions-apply"
    text: "Apply 1 change"
- scrollUntilVisible:
    element:
      id: "sector-unknown-list"
    direction: DOWN
- assertVisible:
    id: "sector-unknown-.*"
    text: "Bank of Baroda.*"
- tapOn:
    id: "sector-suggestions-apply"
- assertVisible:
    id: "sector-suggestions-done"
- assertVisible: "1 holding updated"
- takeScreenshot: .expo/ux-enlarged/sector-suggestions-applied
- tapOn:
    id: "sector-suggestions-close"
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- assertVisible:
    id: "e2e-asset-itbees-ns-classification"
# selector: stored e2e-evidence values are under test
- assertVisible: "Classification: etf \\| etf \\| technology"
- assertVisible: "Values: invested ₹400.00 \\| current ₹600.00 \\| quantity 10"
# The bank's share is untouched.
- scrollUntilVisible:
    element:
      id: "e2e-asset-bankbaroda-ns-classification"
    direction: DOWN
# selector: stored e2e-evidence values are under test
- assertVisible: "Classification: stock \\| stock \\| other"
- openLink: "${SCHEME}:///holdings"
- scrollUntilVisible:
    element:
      id: "holdings-insights-button"
    direction: DOWN
- tapOn:
    id: "holdings-insights-button"
- scrollUntilVisible:
    element:
      id: "holdings-sector-technology"
    direction: DOWN
- assertVisible:
    id: "holdings-sector-technology-pct"
# selector: the INR amounts and the shortcut wording are under test
- assertVisible:
    id: "holdings-sector-technology-value"
    text: "₹600.00"
- assertVisible:
    id: "holdings-sector-other-value"
    text: "₹400.00"
- assertVisible:
    id: "holdings-sector-review"
    text: "Set the sector of 1 Unknown holding"
- takeScreenshot: .expo/ux-enlarged/sector-breakdown
# The bank has no suggestion: set its sector by hand from the shortcut.
- tapOn:
    id: "holdings-sector-review"
- extendedWaitUntil:
    visible:
      id: "sector-unknown-list"
    timeout: 10000
- tapOn:
    id: "sector-unknown-.*"
- extendedWaitUntil:
    visible:
      id: "review-asset-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "asset-sector-picker"
    direction: DOWN
- tapOn:
    id: "asset-sector-picker"
- tapOn:
    id: "asset-sector-financialServices"
- scrollUntilVisible:
    element:
      id: "save-asset-correction-button"
    direction: DOWN
- tapOn:
    id: "save-asset-correction-button"
- extendedWaitUntil:
    visible:
      id: "sector-suggestions-screen"
    timeout: 10000
- assertNotVisible:
    id: "sector-unknown-list"
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- scrollUntilVisible:
    element:
      id: "e2e-asset-bankbaroda-ns-classification"
    direction: DOWN
# selector: stored e2e-evidence values are under test
- assertVisible: "Classification: stock \\| stock \\| financialServices"
