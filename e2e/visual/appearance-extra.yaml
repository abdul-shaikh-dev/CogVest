appId: com.abdulshaikh.cogvest
---
- openLink: "cogvest:///ppf-account"
- assertVisible:
    id: ppf-account-form-screen
- waitForAnimationToEnd
- takeScreenshot: .expo/appearance-537/${STAGE}/ppf
- back
- openLink: "cogvest:///review-snapshot"
- assertVisible:
    id: review-snapshot-screen
- waitForAnimationToEnd
- takeScreenshot: .expo/appearance-537/${STAGE}/snapshot-form
- back
- openLink: "cogvest:///manage-assets"
- assertVisible:
    id: manage-assets-screen
- waitForAnimationToEnd
- takeScreenshot: .expo/appearance-537/${STAGE}/manage-assets
- openLink: "cogvest:///holdings"
- assertVisible:
    id: holding-row-visual-qa-asset-bitcoin
- tapOn: "Hide values"
- waitForAnimationToEnd
- takeScreenshot: .expo/appearance-537/${STAGE}/masked-holdings
- assertNotVisible: "₹13.9L"
- tapOn: "Show values"
