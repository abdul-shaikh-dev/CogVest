appId: ${APP_ID}
---
# Copy review on a fresh APK. Does not create or remove portfolio records.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "${SCHEME}:///quick-portfolio-setup"
- assertVisible: "Import a statement or add holdings manually"
- waitForAnimationToEnd
- takeScreenshot: .expo/app-copy/${SHOT}/setup
- openLink: "${SCHEME}:///import-holdings"
- assertVisible: ".*Import starting quantities and average costs.*"
- assertVisible: ".*not transaction history.*"
- waitForAnimationToEnd
- takeScreenshot: .expo/app-copy/${SHOT}/holdings-import
- openLink: "${SCHEME}:///import-transactions"
- assertVisible:
    id: transaction-import-screen
- waitForAnimationToEnd
- takeScreenshot: .expo/app-copy/${SHOT}/transaction-import
- openLink: "${SCHEME}:///backup?mode=export"
- assertVisible: ".*sensitive financial information and is not encrypted.*"
- assertVisible: ".*document provider may sync the file.*"
- waitForAnimationToEnd
- takeScreenshot: .expo/app-copy/${SHOT}/backup
- openLink: "${SCHEME}:///settings"
- scrollUntilVisible:
    element:
      id: privacy-details-toggle
    direction: DOWN
- tapOn:
    id: privacy-details-toggle
- scrollUntilVisible:
    element: ".*CogVest does not add its own encryption.*"
    direction: DOWN
- assertVisible: ".*CogVest does not add its own encryption.*"
- waitForAnimationToEnd
- takeScreenshot: .expo/app-copy/${SHOT}/privacy
- openLink: "${SCHEME}:///ppf-account"
- assertVisible: "Start with a confirmed balance"
- waitForAnimationToEnd
- takeScreenshot: .expo/app-copy/${SHOT}/ppf
- openLink: "${SCHEME}:///dashboard"
