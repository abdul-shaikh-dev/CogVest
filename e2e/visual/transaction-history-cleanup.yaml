appId: ${APP_ID}
---
# Delete only the synthetic purchase from transaction-correction-setup.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "${SCHEME}:///cash"
- assertVisible: "₹49,795.00"
- openLink: "${SCHEME}:///holding-transactions?assetId=visual-qa-asset-hdfc"
- assertVisible: "1 record"
- assertVisible: "₹205.00"
- tapOn:
    id: start-transaction-selection
- tapOn:
    id: select-all-transactions
- tapOn:
    id: review-selected-transaction-deletion
- assertVisible: ".*1 linked cash movement will be removed.*"
- tapOn:
    id: confirm-delete-selected-transactions
- assertVisible: "No transactions yet"
- openLink: "${SCHEME}:///cash"
- assertVisible: "₹50,000.00"
- openLink: "${SCHEME}:///opening-position?openingPositionId=visual-qa-opening-hdfc"
- assertVisible:
    id: opening-correction-quantity-input
    text: "25"
- stopApp
