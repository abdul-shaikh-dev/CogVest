appId: com.abdulshaikh.cogvest
---
# Run after setup. Keep the synthetic purchase unchanged until cleanup.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "cogvest:///holding-transactions?assetId=visual-qa-asset-hdfc"
- tapOn:
    id: "review-trade-.*"
- assertVisible:
    id: trade-correction-quantity-input
    text: "2"
- assertVisible:
    id: trade-correction-price-input
    text: "100"
- takeScreenshot: .expo/transaction-correction/${SHOT}/details
- scrollUntilVisible:
    element:
      id: trade-correction-total
    direction: DOWN
- assertVisible:
    id: trade-correction-total
    text: "₹205.00"
- scrollUntilVisible:
    element:
      id: trade-correction-context-toggle
    direction: DOWN
- assertNotVisible:
    id: trade-correction-notes-input
- tapOn:
    id: trade-correction-context-toggle
- scrollUntilVisible:
    element:
      id: trade-correction-notes-input
    direction: DOWN
- tapOn:
    id: trade-correction-notes-input
- inputText: "Synthetic QA draft"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: trade-correction-context-toggle
    direction: UP
- tapOn:
    id: trade-correction-context-toggle
- tapOn:
    id: trade-correction-context-toggle
- scrollUntilVisible:
    element:
      id: trade-correction-notes-input
    direction: DOWN
- assertVisible:
    id: trade-correction-notes-input
    text: "Synthetic QA draft"
- takeScreenshot: .expo/transaction-correction/${SHOT}/context
- scrollUntilVisible:
    element:
      id: delete-trade-button
    direction: DOWN
- tapOn:
    id: delete-trade-button
- scrollUntilVisible:
    element:
      id: confirm-delete-trade-button
    direction: DOWN
- takeScreenshot: .expo/transaction-correction/${SHOT}/delete
- tapOn: "Keep transaction"
- assertNotVisible:
    id: confirm-delete-trade-button
- tapOn: "Cancel"
- tapOn:
    id: "review-trade-.*"
- assertVisible:
    id: trade-correction-quantity-input
    text: "2"
- scrollUntilVisible:
    element:
      id: trade-correction-context-toggle
    direction: DOWN
- tapOn:
    id: trade-correction-context-toggle
- scrollUntilVisible:
    element:
      id: trade-correction-notes-input
    direction: DOWN
- assertNotVisible: "Synthetic QA draft"
- stopApp
