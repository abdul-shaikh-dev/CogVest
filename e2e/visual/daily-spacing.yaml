appId: ${APP_ID}
---
# Existing synthetic portfolio; does not create or change financial records.
- openLink: "${SCHEME}:///settings"
- scrollUntilVisible:
    element:
      id: display-mode-${MODE}
    direction: UP
- tapOn:
    id: display-mode-${MODE}
- openLink: "${SCHEME}:///holdings"
- assertVisible:
    id: holding-row-visual-qa-asset-bitcoin
- takeScreenshot: .expo/daily-spacing/${PHASE}/${SIZE}/${MODE}-holdings
- openLink: "${SCHEME}:///dashboard"
- assertVisible: "Portfolio value"
- takeScreenshot: .expo/daily-spacing/${PHASE}/${SIZE}/${MODE}-dashboard
- openLink: "${SCHEME}:///cash"
- assertVisible: "₹50,000.00"
