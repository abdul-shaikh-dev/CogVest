appId: ${APP_ID}
---
# Signed-preview fixture cleanup, using public UI rather than debug evidence.
- openLink: "${SCHEME}:///holdings"
- assertVisible: "No holdings yet"
- assertNotVisible: "My PPF"
- openLink: "${SCHEME}:///futures"
- assertVisible: "Create futures wallet"
- openLink: "${SCHEME}:///cash"
- assertVisible: "₹0.00"
- assertVisible: "No cash movement yet"
- waitForAnimationToEnd
- takeScreenshot: .expo/appearance-completion/release-cleanup/cash
- openLink: "${SCHEME}:///dashboard"
- assertVisible: "Your portfolio starts here"
- waitForAnimationToEnd
- takeScreenshot: .expo/appearance-completion/release-cleanup/dashboard
