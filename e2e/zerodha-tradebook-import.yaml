appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 120000
# The system picker remembers its last folder and view; start it fresh.
- clearState: com.google.android.documentsui
- openLink: "${SCHEME}:///visual-qa-seed?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible: "Replace with visual QA data"
    timeout: 10000
- tapOn: "Replace with visual QA data"
- extendedWaitUntil:
    visible:
      id: "visual-qa-seed-screen"
    timeout: 10000
- openLink: "${SCHEME}:///import-transactions"
- extendedWaitUntil:
    visible:
      id: "transaction-import-screen"
    timeout: 10000
- tapOn:
    id: "transaction-import-source-zerodhaTradebookEqV1"
- scrollUntilVisible:
    element:
      id: "select-transaction-csv"
    direction: DOWN
- tapOn:
    id: "select-transaction-csv"
- runFlow: standalone/helpers/open-downloads.yaml
- extendedWaitUntil:
    visible: "zerodha-tradebook-2024.csv"
    timeout: 10000
- tapOn: "zerodha-tradebook-2024.csv"
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- scrollUntilVisible:
    element:
      id: "transaction-import-preflight"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "transaction-import-mode-full-history"
    direction: DOWN
- tapOn:
    id: "transaction-import-mode-full-history"
    retryTapIfNoChange: true
- assertVisible:
    id: "transaction-import-mode-full-history"
    selected: true
- scrollUntilVisible:
    element:
      id: "select-transaction-csv"
    direction: UP
- tapOn:
    id: "select-transaction-csv"
- runFlow: standalone/helpers/open-downloads.yaml
- extendedWaitUntil:
    visible: "zerodha-tradebook-2025.csv"
    timeout: 10000
- tapOn: "zerodha-tradebook-2025.csv"
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- scrollUntilVisible:
    element:
      id: "transaction-import-shared-cutover"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "transaction-import-shared-cutover"
- tapOn: "OK"
- scrollUntilVisible:
    element:
      id: "transaction-import-no-external-activity"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "transaction-import-no-external-activity"
- scrollUntilVisible:
    element:
      id: "transaction-import-dry-run"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "transaction-import-summary-conflicts"
    direction: DOWN
- assertVisible:
    id: "transaction-import-summary-additions"
    text: "2"
- assertVisible:
    id: "transaction-import-summary-duplicates"
    text: "1"
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "94%,93%"
- scrollUntilVisible:
    element:
      id: "confirm-transaction-import"
    direction: DOWN
    centerElement: false
    visibilityPercentage: 50
    timeout: 10000
# Trades are being imported, not only share adjustments.
- assertVisible: "Confirm transaction import"
- takeScreenshot:
    path: zerodha-tradebook-import-preview
- tapOn:
    id: "confirm-transaction-import"
- extendedWaitUntil:
    visible:
      id: "holdings-screen"
    timeout: 10000
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "e2e-evidence-screen"
    timeout: 10000
- assertVisible: "Trade count: 2"
- assertVisible: "Imported transaction count: 2"
- assertVisible: "Cash entry count: 4"
- assertVisible: "Opening position count: 3"
- scrollUntilVisible:
    element:
      id: "e2e-asset-niftybees-ns-values"
    direction: DOWN
    timeout: 10000
- assertVisible: "Values: invested ₹48,351.60 | current ₹50,553.36 | quantity 198"
- openLink: "${SCHEME}:///import-transactions"
- extendedWaitUntil:
    visible:
      id: "transaction-import-screen"
    timeout: 10000
- tapOn:
    id: "transaction-import-source-zerodhaTradebookEqV1"
- scrollUntilVisible:
    element:
      id: "select-transaction-csv"
    direction: DOWN
- tapOn:
    id: "select-transaction-csv"
- runFlow: standalone/helpers/open-downloads.yaml
- tapOn: "zerodha-tradebook-2024.csv"
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- scrollUntilVisible:
    element:
      id: "transaction-import-preflight"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "transaction-import-mode-full-history"
    direction: DOWN
- tapOn:
    id: "transaction-import-mode-full-history"
    retryTapIfNoChange: true
- assertVisible:
    id: "transaction-import-mode-full-history"
    selected: true
- scrollUntilVisible:
    element:
      id: "select-transaction-csv"
    direction: UP
- tapOn:
    id: "select-transaction-csv"
- runFlow: standalone/helpers/open-downloads.yaml
- tapOn: "zerodha-tradebook-2025.csv"
- runFlow:
    when:
      visible: "1 selected"
    commands:
      # A slow emulator can turn the tap into a long press (selection mode).
      - tapOn: "Select"
- scrollUntilVisible:
    element:
      id: "transaction-import-no-external-activity"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "transaction-import-no-external-activity"
- scrollUntilVisible:
    element:
      id: "transaction-import-dry-run"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "transaction-import-summary-conflicts"
    direction: DOWN
- assertVisible:
    id: "transaction-import-summary-additions"
    text: "0"
- assertVisible:
    id: "transaction-import-summary-duplicates"
    text: "3"
# All rows are duplicates, so the import stays disabled; the button sits at
# the end of the page and cannot be centred.
- scrollUntilVisible:
    element:
      id: "confirm-transaction-import"
      enabled: false
    direction: DOWN
    timeout: 10000
- openLink: "${SCHEME}:///e2e-evidence?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "e2e-evidence-screen"
    timeout: 10000
- assertVisible: "Trade count: 2"
- assertVisible: "Imported transaction count: 2"
