appId: com.abdulshaikh.cogvest
---
# Isolated memory fixture. It never clears or writes the installed portfolio.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 30000
- openLink: "cogvest:///add-holding?visualQaState=lookup&token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "add-holding-phase-asset"
    timeout: 30000
- tapOn:
    id: "asset-lookup-input"
- inputText: "HDFC"
- assertVisible:
    id: "asset-lookup-input"
- takeScreenshot: ".expo/ux12-search-keyboard"
- openLink: "cogvest:///asset-search-qa?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: "asset-search-qa-screen"
    timeout: 30000
- tapOn:
    id: "asset-search-qa-warmup"
- tapOn:
    id: "asset-lookup-input"
- inputText: "HDFC"
- hideKeyboard
- assertVisible: "Showing: All assets"
- scrollUntilVisible:
    element:
      id: "saved-asset-instrument-asset-search-qa-saved-0001"
    direction: DOWN
- assertVisible: "Mutual Fund"
- assertVisible: "No exchange listing"
- scrollUntilVisible:
    element:
      id: "asset-lookup-instrument-asset-search-qa-hdfc-bank-bse"
    direction: DOWN
- assertVisible: "Company share"
- assertVisible: "BSE listing"
- scrollUntilVisible:
    element:
      id: "asset-lookup-instrument-asset-search-qa-hdfc-etf"
    direction: DOWN
- assertVisible:
    id: "asset-lookup-instrument-asset-search-qa-hdfc-etf"
- assertVisible:
    id: "asset-lookup-venue-asset-search-qa-hdfc-etf"
- scrollUntilVisible:
    element:
      id: "asset-lookup-instrument-asset-search-qa-hdfc-rstock"
    direction: DOWN
- assertVisible: "Crypto asset"
- assertVisible: "Not an NSE/BSE share"
- assertNotVisible:
    id: "selected-asset-summary"
- takeScreenshot: ".expo/ux12-mixed-search-results"
- scrollUntilVisible:
    element:
      id: "asset-lookup-result-asset-search-qa-hdfc-bank-bse"
    direction: UP
- tapOn:
    id: "asset-lookup-result-asset-search-qa-hdfc-bank-bse"
- assertVisible:
    id: "selected-asset-summary"
- assertVisible: "HDFCBANK.*HDFCBANK.BO.*Yahoo Finance suggestion"
- assertNotVisible:
    id: "holding-save-complete"
- assertVisible: "Assets: 500; openings: 0"
- takeScreenshot: ".expo/ux12-mixed-search-selected"
