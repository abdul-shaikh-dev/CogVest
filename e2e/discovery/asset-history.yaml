appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 30000
- openLink: "cogvest:///asset-history-qa?token=cogvest-local-visual-qa"
- extendedWaitUntil:
    visible:
      id: asset-history-panel
    timeout: 10000
- assertVisible: "₹200.00"
- tapOn:
    id: asset-history-mode-holdingValue
- assertVisible: "₹1,000.00"
- tapOn:
    id: asset-history-range-10Y
- assertVisible: "₹1,000.00"
- takeScreenshot: .expo/issue22-holding-history
- tapOn:
    id: history-qa-mask
- assertVisible:
    id: asset-history-masked
- assertNotVisible: "₹1,000.00"
- tapOn:
    id: history-qa-mask
- assertVisible: "₹1,000.00"
