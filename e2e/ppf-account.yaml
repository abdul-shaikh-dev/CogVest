appId: com.abdulshaikh.cogvest
---
- launchApp:
    clearState: true
- assertVisible:
    id: "dashboard-screen"
- openLink: "cogvest:///ppf-account"
- assertVisible:
    id: "ppf-account-form-screen"
- scrollUntilVisible:
    element:
      id: "ppf-balance-input"
    direction: DOWN
- tapOn:
    id: "ppf-balance-input"
- inputText: "100000"
- scrollUntilVisible:
    element:
      id: "review-ppf-account"
    direction: DOWN
- tapOn:
    id: "review-ppf-account"
- assertVisible: "Bank or Post Office is required."
- assertVisible:
    id: "ppf-provider-input"
- back
- assertVisible: "Bank or Post Office is required."
- tapOn:
    id: "ppf-provider-input"
- inputText: "India Post"
- hideKeyboard
- assertNotVisible: "Bank or Post Office is required."
- scrollUntilVisible:
    element:
      id: "review-ppf-account"
    direction: DOWN
- tapOn:
    id: "review-ppf-account"
- assertVisible:
    id: "ppf-account-review-screen"
- scrollUntilVisible:
    element:
      id: "save-ppf-account"
    direction: DOWN
- tapOn:
    id: "save-ppf-account"
- assertVisible:
    id: "ppf-confirmed-balance-card"
- assertVisible: "₹1,00,000.00"
- tapOn:
    id: "add-ppf-entry"
- assertVisible:
    id: "ppf-entry-screen"
- assertNotVisible:
    id: "ppf-entry-notes"
- assertVisible:
    id: "ppf-contribution-rules-toggle"
- tapOn:
    id: "ppf-entry-note-toggle"
- tapOn:
    id: "ppf-entry-notes"
- inputText: "Annual contribution"
- hideKeyboard
- tapOn:
    id: "ppf-entry-note-toggle"
- assertNotVisible:
    id: "ppf-entry-notes"
- tapOn:
    id: "ppf-entry-note-toggle"
- assertVisible: "Annual contribution"
- tapOn:
    id: "ppf-entry-amount"
- inputText: "500"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "review-ppf-entry"
    direction: DOWN
- tapOn:
    id: "review-ppf-entry"
- assertVisible:
    id: "ppf-entry-review-screen"
- tapOn: "Edit entry"
- scrollUntilVisible:
    element:
      id: "ppf-entry-notes"
    direction: DOWN
- assertVisible: "Annual contribution"
- pressKey: BACK
- assertVisible:
    id: "ppf-confirmed-balance-card"
- assertVisible: "₹1,00,000.00"
- assertVisible:
    id: "ppf-ledger-actions"
- assertVisible: "Add entry"
- assertVisible: "Import CSV"
- tapOn:
    id: "ppf-account-back"
- assertVisible:
    id: "dashboard-screen"
- tapOn:
    id: "tab-holdings"
- assertVisible:
    id: "holdings-screen"
- assertVisible:
    id: "holdings-ppf-section"
- assertVisible: "My PPF"
- assertVisible: "₹1L"
- tapOn: "My PPF"
- assertVisible:
    id: "ppf-confirmed-balance-card"
- assertVisible: "₹1,00,000.00"
