name: Android Preview APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-apk:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install EAS CLI
        run: npm install --global eas-cli@27

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Expo doctor
        run: npm run doctor

      - name: Build preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # eas-cli exits 0 when EAS cancels a build (for example at the
        # build-time limit), so fail unless the build finished.
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          jq '.[0] | {id, status, appVersion, appBuildVersion, artifacts}' build.json
          test "$(jq -r '.[0].status' build.json)" = "FINISHED"
